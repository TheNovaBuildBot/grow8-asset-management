<!doctype html>
<html lang="en">
<head>

<title>Managed by NovaBuildBot</title>

  a.btn{display:inline-block;background:#1F3A5F;color:#fff;text-decoration:none;font-weight:600;
        font-size:15px;padding:12px 22px;border-radius:12px}
  a.btn:hover{background:#2A4A72}
</style>
</head>

  <div class="card">
    <svg class="face" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="50" fill="#D97757"/>
      <ellipse cx="34" cy="45" rx="8.5" ry="12.5" fill="#fff"/>
      <ellipse cx="66" cy="45" rx="8.5" ry="12.5" fill="#fff"/>
    </svg>
    <h1>This website is managed by NovaBuildBot</h1>
    <p>NovaBuildBot builds and runs websites, search, AI visibility and social media for businesses, with an AI marketing manager that works every week.</p>

  </div>
